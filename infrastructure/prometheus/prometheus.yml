global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "rag-backend"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "celery-flower"
    metrics_path: "/metrics"
    basic_auth:
      username: "admin"
      password: "admin"
    static_configs:
      - targets: ["flower:5555"]
